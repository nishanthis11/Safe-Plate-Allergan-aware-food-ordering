spring:
  application:
    name: smart-food-ordering
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_food}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:979142hsin}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  thymeleaf:
    cache: false
  servlet:
    session:
      timeout: 30m
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
app:
  payment:
    provider: sandbox
  recommendation:
    max-results: 10
  seed:
    enabled: true
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
