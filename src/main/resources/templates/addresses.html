<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Addresses')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3">Delivery addresses</h1>
    <div class="row g-4">
        <div class="col-lg-6">
            <p class="text-muted" th:if="${#lists.isEmpty(addresses)}">No addresses saved yet.</p>
            <div class="card mb-2" th:each="a : ${addresses}">
                <div class="card-body d-flex justify-content-between align-items-start">
                    <div>
                        <strong th:text="${a.label()}">Home</strong>
                        <span class="badge text-bg-success ms-1" th:if="${a.defaultAddress()}">Default</span>
                        <div class="small" th:text="${a.fullAddress()}">address</div>
                        <div class="small text-muted" th:text="${a.contactPhone()}">phone</div>
                    </div>
                    <form th:action="@{/customer/addresses/{id}/delete(id=${a.id()})}" method="post">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <form th:action="@{/customer/addresses}" th:object="${form}" method="post" class="card card-body" novalidate>
                <h2 class="h5">Add an address</h2>
                <div class="mb-2"><label class="form-label" for="label">Label</label>
                    <input class="form-control" th:field="*{label}" th:errorclass="is-invalid" placeholder="Home, Work...">
                    <div class="invalid-feedback" th:errors="*{label}"></div></div>
                <div class="mb-2"><label class="form-label" for="line1">Address line 1</label>
                    <input class="form-control" th:field="*{line1}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{line1}"></div></div>
                <div class="mb-2"><label class="form-label" for="line2">Address line 2</label>
                    <input class="form-control" th:field="*{line2}"></div>
                <div class="row g-2 mb-2">
                    <div class="col-sm-6"><label class="form-label" for="city">City</label>
                        <input class="form-control" th:field="*{city}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{city}"></div></div>
                    <div class="col-sm-6"><label class="form-label" for="state">State</label>
                        <input class="form-control" th:field="*{state}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{state}"></div></div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-sm-6"><label class="form-label" for="postalCode">Postal code</label>
                        <input class="form-control" th:field="*{postalCode}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{postalCode}"></div></div>
                    <div class="col-sm-6"><label class="form-label" for="contactPhone">Contact phone</label>
                        <input class="form-control" th:field="*{contactPhone}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{contactPhone}"></div></div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{defaultAddress}">
                    <label class="form-check-label" for="defaultAddress">Use as default</label>
                </div>
                <button class="btn btn-success" type="submit">Save address</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
