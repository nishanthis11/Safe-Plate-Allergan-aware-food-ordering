<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Restaurants')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3">Restaurants</h1>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="table-responsive">
                <table class="table table-sm bg-white border align-middle">
                    <thead><tr><th>Name</th><th>Cuisine</th><th>Delivery fee</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${restaurants}">
                        <td th:text="${r.name()}">Name</td>
                        <td th:text="${r.cuisine()}">cuisine</td>
                        <td th:text="|₹${#numbers.formatDecimal(r.deliveryFee(), 1, 2)}|">0</td>
                        <td><span class="badge" th:classappend="${r.active()} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${r.active()} ? 'Active' : 'Inactive'">x</span></td>
                        <td class="text-end">
                            <form th:action="@{/admin/restaurants/{id}/active(id=${r.id()})}" method="post">
                                <input type="hidden" name="active" th:value="${!r.active()}">
                                <button class="btn btn-outline-secondary btn-sm" type="submit" th:text="${r.active()} ? 'Deactivate' : 'Activate'">x</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-4">
            <form th:action="@{/admin/restaurants}" th:object="${form}" method="post" class="card card-body" novalidate>
                <h2 class="h5">Add restaurant</h2>
                <div class="mb-2"><label class="form-label" for="name">Name</label>
                    <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div></div>
                <div class="mb-2"><label class="form-label" for="cuisine">Cuisine</label>
                    <input class="form-control" th:field="*{cuisine}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{cuisine}"></div></div>
                <div class="mb-2"><label class="form-label" for="description">Description</label>
                    <textarea class="form-control" rows="2" th:field="*{description}"></textarea></div>
                <div class="mb-2"><label class="form-label" for="address">Address</label>
                    <input class="form-control" th:field="*{address}"></div>
                <div class="mb-3"><label class="form-label" for="deliveryFee">Delivery fee (&#8377;)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{deliveryFee}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{deliveryFee}"></div></div>
                <button class="btn btn-success" type="submit">Create</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
