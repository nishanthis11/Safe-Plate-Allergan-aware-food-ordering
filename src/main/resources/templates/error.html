<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="state-page">
        <div class="big warn"><i class="bi bi-emoji-frown"></i></div>
        <h1 class="h3" th:text="${title != null} ? ${title} : 'Something went wrong'">Something went wrong</h1>
        <p class="text-muted" th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Please try again, or go back to the home page.'">Please try again.</p>
        <a class="btn btn-success" th:href="@{/}"><i class="bi bi-house me-1"></i>Back to home</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
